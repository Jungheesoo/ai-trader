<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AI 트레이더</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">📈 AI 트레이더</div>
    <div class="header-sub" id="today-date"></div>
  </div>
  <div class="market-status" id="market-status"></div>
</div>

<div id="day-warning"></div>

<!-- 총 자산 -->
<div class="card" style="margin-top:16px">
  <div class="card-title">총 자산 현황</div>
  <div id="summary-grid">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<!-- 보유 종목 -->
<div class="card">
  <div class="card-title">보유 종목</div>
  <div id="holdings-list">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<!-- AI 분석 요약 -->
<div class="card">
  <div class="card-title">오늘 AI 분석</div>
  <div id="ai-summary">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<!-- 통계 -->
<div class="stat-grid">
  <div class="stat-item">
    <div class="stat-value" id="sonnet-count">-</div>
    <div class="stat-label">AI 사용 횟수</div>
  </div>
  <div class="stat-item">
    <div class="stat-value" id="alert-count">-</div>
    <div class="stat-label">오늘 알림</div>
  </div>
  <div class="stat-item">
    <div class="stat-value" id="cash-hold-count">-</div>
    <div class="stat-label">현금보유 판단</div>
  </div>
</div>

<nav class="nav-bottom">
  <a href="/" class="active"><span class="icon">🏠</span>홈</a>
  <a href="/portfolio.html"><span class="icon">💼</span>자산입력</a>
  <a href="/chat.html"><span class="icon">🤖</span>AI질문</a>
  <a href="/history.html"><span class="icon">📊</span>이력</a>
</nav>

<script>
const today = new Date();
document.getElementById('today-date').textContent =
  today.toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric',weekday:'long'});

function getMarketStatus() {
  const h = today.getHours(), m = today.getMinutes();
  const total = h * 60 + m, day = today.getDay();
  if (day === 0 || day === 6) return {status:'closed', label:'주말 휴장'};
  if (total >= 540 && total < 930) return {status:'open', label:'장 중'};
  if (total >= 480 && total < 540) return {status:'pre', label:'장 전'};
  return {status:'closed', label:'장 마감'};
}

function renderMarketStatus() {
  const ms = getMarketStatus();
  const el = document.getElementById('market-status');
  const cls = ms.status === 'open' ? 'market-open' : ms.status === 'pre' ? 'market-pre' : 'market-closed';
  el.className = 'market-status ' + cls;
  el.innerHTML = `<span class="market-dot"></span>${ms.label}`;
}
renderMarketStatus();

function renderDayWarning() {
  const day = today.getDay();
  const el = document.getElementById('day-warning');
  if (day === 5) {
    el.innerHTML = '<div class="warning-banner">⚠️ 금요일 — 오후 2시 이후 신규 진입 자제. 주말 효과 대비하세요.</div>';
  } else if (day === 1) {
    el.innerHTML = '<div class="info-banner">📌 월요일 — 주말 효과 하락 가능. 급락 시 악재 여부를 먼저 확인하세요.</div>';
  }
}
renderDayWarning();

function fmt(n) { return n == null ? '-' : Math.round(n).toLocaleString(); }
function fmtRate(r) { return r == null ? '-' : (r >= 0 ? '+' : '') + r.toFixed(1) + '%'; }

async function loadDashboard() {
  try {
    const res = await fetch('/api/portfolio');
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    const p = json.data;

    // 총 자산
    const rateSign = (p.overallProfitRate || 0) >= 0 ? '+' : '';
    const rateCls = (p.overallProfitRate || 0) >= 0 ? 'positive' : 'negative';
    const pnl = p.unrealizedPnL || 0;
    const pnlSign = pnl >= 0 ? '+' : '';
    const pnlCls = pnl >= 0 ? 'positive' : 'negative';

    document.getElementById('summary-grid').innerHTML = `
      <div style="margin-bottom:16px">
        <div class="summary-label">총 운용 자산</div>
        <div class="pnl-big" style="margin-top:4px">${fmt(p.totalAssets)}원</div>
        <div style="font-size:13px;margin-top:4px" class="${pnlCls}">${pnlSign}${fmt(pnl)}원 (${rateSign}${(p.overallProfitRate||0).toFixed(1)}%)</div>
      </div>
      <div class="summary-grid">
        <div class="summary-item">
          <div class="summary-label">보유 주식</div>
          <div class="summary-value small">${fmt(p.stockValue)}원</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">현금</div>
          <div class="summary-value small">${fmt(p.cash)}원</div>
        </div>
      </div>
    `;

    // 보유 종목
    const holdingsEl = document.getElementById('holdings-list');
    if (!p.holdings || p.holdings.length === 0) {
      holdingsEl.innerHTML = `<div class="empty-state">
        <div class="icon">📭</div>
        <div class="title">보유 종목 없음</div>
        <div class="desc"><a href="/portfolio.html">자산 입력하기</a></div>
      </div>`;
    } else {
      holdingsEl.innerHTML = p.holdings.map(h => {
        const pr = h.profitRate || 0;
        const pSign = pr >= 0 ? '+' : '';
        const pCls = pr >= 0 ? 'positive' : 'negative';
        const rsi = h.rsi != null ? h.rsi.toFixed(0) : null;
        const rsiCls = h.rsi >= 70 ? 'danger' : h.rsi <= 30 ? 'safe' : '';
        const rsiColor = h.rsi >= 70 ? 'var(--red)' : h.rsi <= 30 ? 'var(--green)' : 'var(--blue)';
        const rsiPct = h.rsi ? Math.min(100, h.rsi) : 50;
        const macd = h.macd || null;
        const macdCls = macd === '데드크로스' ? 'danger' : macd === '골든크로스' ? 'safe' : '';

        let actionCls = 'hold', actionText = h.lastAction || '';
        if (actionText.includes('매도')) actionCls = 'sell';
        else if (actionText.includes('매수')) actionCls = 'buy';

        return `<div class="stock-row">
          <div class="stock-row-flex">
            <div>
              <div class="stock-name">${h.stock_name}</div>
              <div class="stock-meta">${h.quantity}주 &nbsp;·&nbsp; 평단 ${fmt(h.avg_price)}원</div>
            </div>
            <div class="stock-price">
              <div class="price">${fmt(h.current_price || h.avg_price)}원</div>
              <div class="rate ${pCls}">${pSign}${pr.toFixed(1)}%</div>
            </div>
          </div>
          <div class="tech-row">
            ${rsi != null ? `<span class="tech-chip ${rsiCls}">RSI ${rsi}</span>` : ''}
            ${macd ? `<span class="tech-chip ${macdCls}">MACD ${macd}</span>` : ''}
            ${h.isBackup ? '<span class="tech-chip warn">네이버 백업</span>' : ''}
          </div>
          ${rsi != null ? `<div class="rsi-bar" style="margin-top:8px"><div class="rsi-fill" style="width:${rsiPct}%;background:${rsiColor}"></div></div>` : ''}
          ${actionText ? `<div class="ai-action ${actionCls}"><span class="action-label action-${actionCls}">→ ${actionText}</span>${h.lastReason ? `<span style="color:var(--text-muted);font-size:11px">&nbsp;${h.lastReason}</span>` : ''}</div>` : ''}
        </div>`;
      }).join('');
    }

    // AI 요약
    const aiEl = document.getElementById('ai-summary');
    if (p.latestAnalysis) {
      const a = p.latestAnalysis;
      let aCls = 'hold';
      if ((a.action||'').includes('매도')) aCls = 'sell';
      else if ((a.action||'').includes('매수')) aCls = 'buy';
      const timeStr = a.created_at ? new Date(a.created_at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}) : '';
      aiEl.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <div style="font-size:17px;font-weight:800" class="action-${aCls}">${a.action || '-'}</div>
          ${a.confidence ? `<span class="badge ${a.confidence==='높음'?'badge-green':a.confidence==='보통'?'badge-yellow':'badge-red'}">${a.confidence}</span>` : ''}
          <span style="font-size:11px;color:var(--text-muted);margin-left:auto">${timeStr}</span>
        </div>
        <div style="font-size:13px;color:var(--text-muted);line-height:1.6">${a.reason || '-'}</div>
        ${a.target_price ? `<div style="margin-top:10px;font-size:12px;display:flex;gap:16px">
          <span>🎯 목표가 <strong>${fmt(a.target_price)}원</strong></span>
          ${a.stop_loss ? `<span>🛡 손절가 <strong>${fmt(a.stop_loss)}원</strong></span>` : ''}
        </div>` : ''}
      `;
    } else {
      aiEl.innerHTML = `<div class="empty-state" style="padding:16px 0">
        <div class="desc">아직 AI 분석이 없습니다</div>
      </div>`;
    }
  } catch (e) {
    document.getElementById('holdings-list').innerHTML =
      `<div class="empty-state"><div class="desc">데이터 로드 실패: ${e.message}</div></div>`;
  }
}

async function loadStats() {
  try {
    const [r1, r2, r3] = await Promise.all([
      fetch('/api/chat/sonnet-status'),
      fetch('/api/history/alerts'),
      fetch('/api/history?limit=30')
    ]);
    const [j1, j2, j3] = await Promise.all([r1.json(), r2.json(), r3.json()]);
    if (j1.ok) document.getElementById('sonnet-count').textContent = `${j1.data.used}/15`;
    if (j2.ok) document.getElementById('alert-count').textContent = j2.data.length;
    if (j3.ok) {
      const today = new Date().toISOString().slice(0,10);
      const cnt = j3.data.filter(a => a.cash_recommendation === '현금보유' && a.date === today).length;
      document.getElementById('cash-hold-count').textContent = cnt;
    }
  } catch(e) {}
}

loadDashboard();
loadStats();
</script>
</body>
</html>
