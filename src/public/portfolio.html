<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>자산 입력 - AI 트레이더</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📈%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">💼 자산현황 입력</div>
    <div class="header-sub" id="deadline-label"></div>
  </div>
</div>

<div id="status-banner"></div>

<div class="card" style="margin-top:16px">
  <div class="card-title">보유 종목</div>
  <div id="holdings-container"></div>
  <button class="btn btn-secondary btn-sm" style="margin-top:4px" onclick="addHolding()">+ 종목 추가</button>
</div>

<div class="card">
  <div class="card-title">📋 매매 완료 입력</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button class="btn btn-secondary btn-sm" onclick="openTradeModal('sell_profit')">✅ 익절 완료</button>
    <button class="btn btn-secondary btn-sm" onclick="openTradeModal('sell_loss')">🛑 손절 완료</button>
    <button class="btn btn-secondary btn-sm" onclick="openTradeModal('switch')">🔄 갈아타기</button>
    <button class="btn btn-secondary btn-sm" onclick="openTradeModal('buy')">💰 신규 매수</button>
  </div>
</div>

<!-- 매매 완료 모달 -->
<div id="trade-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;overflow-y:auto;">
  <div style="background:#fff;margin:20px auto;max-width:480px;border-radius:12px;padding:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <strong id="modal-title" style="font-size:16px;"></strong>
      <button onclick="closeTradeModal()" style="background:none;border:none;font-size:20px;cursor:pointer;">✕</button>
    </div>
    <div id="modal-body"></div>
    <div id="modal-result" style="background:#f0fdf4;border-radius:8px;padding:12px;margin:12px 0;display:none;font-size:14px;"></div>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button class="btn btn-secondary" style="flex:1" onclick="closeTradeModal()">취소</button>
      <button class="btn btn-primary" style="flex:1" id="modal-save-btn" onclick="saveTrade()">저장</button>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-title">현금 / 신규 투입금</div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label">현금 보유액 (원)</label>
      <input class="form-input num-input" type="text" inputmode="numeric" id="cash-input" placeholder="0">
    </div>
    <div class="form-group">
      <label class="form-label">신규 투입 가능 (원)</label>
      <input class="form-input num-input" type="text" inputmode="numeric" id="new-invest-input" placeholder="0">
    </div>
  </div>
</div>

<div style="margin:0 16px 8px">
  <button class="btn btn-primary" id="save-btn" onclick="savePortfolio()">저장 및 AI 분석 시작</button>
</div>

<div class="tip-box">
  💡 <strong>종목 약어:</strong> 삼전, 하이닉스, 카카오, 네이버, 현대차, 기아, 두산에너, 삼바, 한화에어, 셀트리온, LG에너지, 포스코
</div>

<nav class="nav-bottom">
  <a href="/"><span class="icon">🏠</span>홈</a>
  <a href="/portfolio.html" class="active"><span class="icon">💼</span>자산입력</a>
  <a href="/chat.html"><span class="icon">🤖</span>AI질문</a>
  <a href="/history.html"><span class="icon">📊</span>이력</a>
</nav>

<script>
let holdingCount = 0;

function addHolding(data = {}) {
  holdingCount++;
  const id = 'h' + holdingCount;
  const div = document.createElement('div');
  div.className = 'holding-item';
  div.id = id;
  div.innerHTML = `
    <button class="remove-btn" onclick="removeHolding('${id}')">✕</button>
    <div class="form-group">
      <label class="form-label">종목명 (약어 가능)</label>
      <input class="form-input" type="text" placeholder="예: 두산에너" value="${data.stock_name||''}" id="${id}-name">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">보유 수량 (주)</label>
        <input class="form-input num-input" type="text" inputmode="numeric" placeholder="0" value="${data.quantity ? Number(data.quantity).toLocaleString() : ''}" id="${id}-qty">
      </div>
      <div class="form-group">
        <label class="form-label">평균 단가 (원)</label>
        <input class="form-input num-input" type="text" inputmode="numeric" placeholder="0" value="${data.avg_price ? Number(data.avg_price).toLocaleString() : ''}" id="${id}-price">
      </div>
    </div>
  `;
  document.getElementById('holdings-container').appendChild(div);
  div.querySelectorAll('.num-input').forEach(attachNumFormat);
}

function removeHolding(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function parseNum(val) {
  return parseFloat(String(val).replace(/,/g, '')) || 0;
}

function formatNum(val) {
  const n = parseFloat(String(val).replace(/,/g, ''));
  if (isNaN(n) || val === '' || val === '-') return val;
  return Math.floor(n).toLocaleString();
}

function attachNumFormat(el) {
  el.addEventListener('input', function() {
    const raw = this.value.replace(/,/g, '').replace(/[^0-9]/g, '');
    if (raw === '') { this.value = ''; return; }
    const pos = this.selectionStart;
    const prevCommas = (this.value.slice(0, pos).match(/,/g) || []).length;
    this.value = Number(raw).toLocaleString();
    const newCommas = (this.value.slice(0, pos).match(/,/g) || []).length;
    try { this.setSelectionRange(pos + newCommas - prevCommas, pos + newCommas - prevCommas); } catch(e) {}
  });
}

function getHoldings() {
  const items = document.querySelectorAll('.holding-item');
  const result = [];
  items.forEach(item => {
    const id = item.id;
    const name = document.getElementById(id+'-name').value.trim();
    const qty = document.getElementById(id+'-qty').value;
    const price = document.getElementById(id+'-price').value;
    if (name && qty && price) {
      result.push({ stock_name: name, quantity: parseInt(parseNum(qty)), avg_price: parseNum(price) });
    }
  });
  return result;
}

async function savePortfolio() {
  const btn = document.getElementById('save-btn');
  const holdings = getHoldings();
  const cash = parseNum(document.getElementById('cash-input').value) || 0;
  const newInvestment = parseNum(document.getElementById('new-invest-input').value) || 0;

  if (holdings.length === 0) {
    showBanner('error', '보유 종목을 1개 이상 입력해주세요.');
    return;
  }

  btn.disabled = true;
  btn.textContent = '저장 중...';

  try {
    const res = await fetch('/api/portfolio', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ holdings, cash, newInvestment })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);
    showBanner('success', '✅ 저장 완료! AI 분석이 시작되었습니다. 카카오톡 알림을 확인해주세요.');
    btn.textContent = '저장 완료 ✓';
    setTimeout(() => { window.location.href = '/'; }, 2000);
  } catch (e) {
    showBanner('error', '저장 실패: ' + e.message);
    btn.disabled = false;
    btn.textContent = '저장 및 AI 분석 시작';
  }
}

function showBanner(type, msg) {
  const el = document.getElementById('status-banner');
  const cls = type === 'error' ? 'alert-banner' : type === 'success' ? 'info-banner' : 'warning-banner';
  el.innerHTML = `<div class="${cls}">${msg}</div>`;
}

function setDeadline() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  const el = document.getElementById('deadline-label');
  if (h === 8 && m < 10) {
    el.textContent = '⏰ 8시 10분까지 입력해주세요';
    el.style.color = 'var(--red)';
  } else if (h === 8 && m >= 10) {
    el.textContent = '입력 마감 — 저장은 가능합니다';
  } else {
    el.textContent = '오늘 자산현황 입력';
  }
}
setDeadline();

async function loadExisting() {
  try {
    const res = await fetch('/api/portfolio/holdings');
    const json = await res.json();
    if (json.ok && json.data.length > 0) {
      json.data.forEach(h => addHolding(h));
    }
    const res2 = await fetch('/api/portfolio');
    const json2 = await res2.json();
    if (json2.ok && json2.data) {
      if (json2.data.cash) document.getElementById('cash-input').value = Number(json2.data.cash).toLocaleString();
      if (json2.data.newInvestment) document.getElementById('new-invest-input').value = Number(json2.data.newInvestment).toLocaleString();
    }
  } catch(e) {
    // 기본값 없음
  }
}
loadExisting();
attachNumFormat(document.getElementById('cash-input'));
attachNumFormat(document.getElementById('new-invest-input'));

// ── 매매 완료 모달 ──────────────────────────────────────
let currentTradeType = '';

const TRADE_CONFIG = {
  sell_profit: { title: '✅ 익절 완료 입력', needAvg: true },
  sell_loss:   { title: '🛑 손절 완료 입력', needAvg: true },
  switch:      { title: '🔄 갈아타기 입력', needAvg: true },
  buy:         { title: '💰 신규 매수 입력', needAvg: false }
};

function getCurrentHoldings() {
  const items = document.querySelectorAll('.holding-item');
  const result = [];
  items.forEach(item => {
    const id = item.id;
    const name = document.getElementById(id+'-name')?.value?.trim();
    const price = parseNum(document.getElementById(id+'-price')?.value || '0');
    const qty = parseInt(parseNum(document.getElementById(id+'-qty')?.value || '0'));
    if (name) result.push({ name, avg_price: price, quantity: qty });
  });
  return result;
}

function openTradeModal(type) {
  currentTradeType = type;
  const cfg = TRADE_CONFIG[type];
  document.getElementById('modal-title').textContent = cfg.title;
  document.getElementById('modal-result').style.display = 'none';
  document.getElementById('modal-result').innerHTML = '';

  const holdings = getCurrentHoldings();
  const holdingOpts = holdings.map(h => `<option value="${h.name}" data-avg="${h.avg_price}" data-qty="${h.quantity}">${h.name}</option>`).join('');

  let html = '';
  if (['sell_profit', 'sell_loss', 'switch'].includes(type)) {
    html += `<div class="form-group"><label class="form-label">종목명</label>
      <select class="form-input" id="t-name" onchange="updateModalCalc()">${holdingOpts || '<option value="">종목없음</option>'}</select></div>`;
    html += `<div class="form-group"><label class="form-label">매도가 (원)</label>
      <input class="form-input num-input" id="t-price" type="text" inputmode="numeric" placeholder="0" oninput="updateModalCalc()"></div>`;
    html += `<div class="form-group"><label class="form-label">수량 (주)</label>
      <input class="form-input num-input" id="t-qty" type="text" inputmode="numeric" placeholder="0" oninput="updateModalCalc()"></div>`;
    if (type === 'switch') {
      html += `<hr style="margin:12px 0"><div style="font-size:13px;color:#666;margin-bottom:8px;">신규 매수 종목</div>`;
      html += `<div class="form-group"><label class="form-label">새 종목명</label>
        <input class="form-input" id="t-new-name" type="text" placeholder="예: 한화에어로스페이스"></div>`;
      html += `<div class="form-row"><div class="form-group"><label class="form-label">매수가 (원)</label>
        <input class="form-input num-input" id="t-new-price" type="text" inputmode="numeric" placeholder="0"></div>
        <div class="form-group"><label class="form-label">수량 (주)</label>
        <input class="form-input num-input" id="t-new-qty" type="text" inputmode="numeric" placeholder="0"></div></div>`;
    }
  } else {
    html += `<div class="form-group"><label class="form-label">종목명 (약어 가능)</label>
      <input class="form-input" id="t-name" type="text" placeholder="예: 두산에너"></div>`;
    html += `<div class="form-row"><div class="form-group"><label class="form-label">매수가 (원)</label>
      <input class="form-input num-input" id="t-price" type="text" inputmode="numeric" placeholder="0"></div>
      <div class="form-group"><label class="form-label">수량 (주)</label>
      <input class="form-input num-input" id="t-qty" type="text" inputmode="numeric" placeholder="0"></div></div>`;
  }
  html += `<div class="form-group"><label class="form-label">메모 (선택)</label>
    <input class="form-input" id="t-memo" type="text" placeholder="선택 입력"></div>`;

  document.getElementById('modal-body').innerHTML = html;
  document.querySelectorAll('#trade-modal .num-input').forEach(attachNumFormat);

  // 보유종목 기본값 자동 채움
  if (['sell_profit', 'sell_loss', 'switch'].includes(type) && holdings.length > 0) {
    document.getElementById('t-qty').value = holdings[0].quantity.toLocaleString();
    updateModalCalc();
  }

  document.getElementById('trade-modal').style.display = 'block';
}

function updateModalCalc() {
  if (!['sell_profit', 'sell_loss', 'switch'].includes(currentTradeType)) return;
  const nameEl = document.getElementById('t-name');
  const priceVal = parseNum(document.getElementById('t-price')?.value || '0');
  const qtyVal = parseNum(document.getElementById('t-qty')?.value || '0');
  if (!nameEl || !priceVal || !qtyVal) return;

  const opt = nameEl.options[nameEl.selectedIndex];
  const avgPrice = parseFloat(opt?.dataset?.avg || '0');
  if (!avgPrice) return;

  const pl = Math.round((priceVal - avgPrice) * qtyVal);
  const plRate = avgPrice > 0 ? ((priceVal - avgPrice) / avgPrice * 100).toFixed(2) : '0.00';
  const sign = pl >= 0 ? '+' : '';
  const color = pl >= 0 ? '#16a34a' : '#dc2626';

  const resultEl = document.getElementById('modal-result');
  resultEl.style.display = 'block';
  resultEl.style.background = pl >= 0 ? '#f0fdf4' : '#fef2f2';
  resultEl.innerHTML = `평단가: ${avgPrice.toLocaleString()}원 → 매도가: ${priceVal.toLocaleString()}원<br>
    <strong style="color:${color};font-size:16px;">${sign}${pl.toLocaleString()}원 (${sign}${plRate}%)</strong>`;
}

function closeTradeModal() {
  document.getElementById('trade-modal').style.display = 'none';
  currentTradeType = '';
}

async function saveTrade() {
  const btn = document.getElementById('modal-save-btn');
  btn.disabled = true;
  btn.textContent = '저장 중...';

  try {
    const nameEl = document.getElementById('t-name');
    const stockName = nameEl?.value?.trim() || (nameEl?.options?.[nameEl.selectedIndex]?.value) || '';
    const price = parseNum(document.getElementById('t-price')?.value || '0');
    const qty = parseInt(parseNum(document.getElementById('t-qty')?.value || '0'));
    const memo = document.getElementById('t-memo')?.value?.trim() || '';

    if (!stockName || !price || !qty) {
      showBanner('error', '종목명, 가격, 수량을 모두 입력해주세요.');
      btn.disabled = false; btn.textContent = '저장';
      return;
    }

    const opt = nameEl?.options?.[nameEl.selectedIndex];
    const avgPrice = parseFloat(opt?.dataset?.avg || '0') || null;

    // 주 매매 저장
    const res = await fetch('/api/portfolio/trades', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        trade_type: currentTradeType,
        stock_name: stockName,
        quantity: qty, price, avg_price: avgPrice, memo
      })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error);

    // 갈아타기: 신규 매수도 저장
    if (currentTradeType === 'switch') {
      const newName = document.getElementById('t-new-name')?.value?.trim();
      const newPrice = parseNum(document.getElementById('t-new-price')?.value || '0');
      const newQty = parseInt(parseNum(document.getElementById('t-new-qty')?.value || '0'));
      if (newName && newPrice && newQty) {
        await fetch('/api/portfolio/trades', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ trade_type: 'buy', stock_name: newName, quantity: newQty, price: newPrice, memo: '갈아타기 매수' })
        });
      }
    }

    closeTradeModal();
    const pl = json.data?.profitLoss;
    const sign = pl >= 0 ? '+' : '';
    const msg = pl !== null && pl !== undefined
      ? `✅ 저장 완료! 실현 손익: ${sign}${Math.round(pl).toLocaleString()}원`
      : '✅ 저장 완료!';
    showBanner('success', msg);
    setTimeout(() => loadExisting(), 1000);
  } catch (e) {
    showBanner('error', '저장 실패: ' + e.message);
    btn.disabled = false; btn.textContent = '저장';
  }
}
</script>
</body>
</html>
