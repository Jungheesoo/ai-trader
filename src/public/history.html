<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>분석 이력 - AI 트레이더</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">📊 분석 이력</div>
    <div class="header-sub">AI 추천 이력 및 성과</div>
  </div>
</div>

<div class="stat-grid" style="margin-top:16px">
  <div class="stat-item">
    <div class="stat-value positive" id="accuracy-rate">-</div>
    <div class="stat-label">AI 적중률</div>
  </div>
  <div class="stat-item">
    <div class="stat-value" id="seed-growth">-</div>
    <div class="stat-label">시드 성장</div>
  </div>
  <div class="stat-item">
    <div class="stat-value" id="sell-count">-</div>
    <div class="stat-label">익절 횟수</div>
  </div>
</div>

<div class="card">
  <div class="card-title">시드 성장 이력</div>
  <div id="seed-chart">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<div class="card">
  <div class="card-title">AI 추천 이력</div>
  <div id="history-list">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<nav class="nav-bottom">
  <a href="/"><span class="icon">🏠</span>홈</a>
  <a href="/portfolio.html"><span class="icon">💼</span>자산입력</a>
  <a href="/chat.html"><span class="icon">🤖</span>AI질문</a>
  <a href="/history.html" class="active"><span class="icon">📊</span>이력</a>
</nav>

<script>
async function loadPerformance() {
  try {
    const res = await fetch('/api/history/performance?period=30');
    const json = await res.json();
    if (!json.ok) return;
    const d = json.data;

    if (d.accuracy_rate !== null) {
      document.getElementById('accuracy-rate').textContent = d.accuracy_rate + '%';
    }

    if (d.seed_growth && d.seed_growth.length >= 2) {
      const first = d.seed_growth[0];
      const last = d.seed_growth[d.seed_growth.length - 1];
      const rate = first.total_assets > 0
        ? (((last.total_assets - first.total_assets) / first.total_assets) * 100).toFixed(1)
        : 0;
      const sign = rate >= 0 ? '+' : '';
      const el = document.getElementById('seed-growth');
      el.textContent = sign + rate + '%';
      el.className = 'stat-value ' + (rate >= 0 ? 'positive' : 'negative');
    }

    document.getElementById('sell-count').textContent = d.sell_count || 0;
    renderSeedChart(d.seed_growth || []);
  } catch(e) {}
}

function renderSeedChart(data) {
  const el = document.getElementById('seed-chart');
  if (!data.length) {
    el.innerHTML = `<div class="empty-state" style="padding:16px 0">
      <div class="icon">📉</div>
      <div class="desc">시드 이력 없음</div>
    </div>`;
    return;
  }
  el.innerHTML = data.slice(-10).map(d => {
    const rate = d.daily_profit_loss_rate || 0;
    const sign = rate >= 0 ? '+' : '';
    const cls = rate >= 0 ? 'positive' : 'negative';
    const barWidth = Math.min(100, Math.abs(rate) * 10);
    const barColor = rate >= 0 ? 'var(--up)' : 'var(--down)';
    return `<div class="history-item">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div class="history-date">${d.date}</div>
          <div style="font-size:15px;font-weight:700;margin-top:2px">${(d.total_assets||0).toLocaleString()}원</div>
        </div>
        <div style="text-align:right">
          <div class="${cls}" style="font-size:14px;font-weight:700">${sign}${rate.toFixed(1)}%</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:2px">익절 ${d.sell_count||0} · 현금보유 ${d.cash_hold_count||0}</div>
        </div>
      </div>
      <div style="height:3px;border-radius:2px;background:var(--border);margin-top:8px;overflow:hidden">
        <div style="height:100%;width:${barWidth}%;background:${barColor};border-radius:2px"></div>
      </div>
    </div>`;
  }).join('');
}

async function loadHistory() {
  try {
    const res = await fetch('/api/history?limit=20');
    const json = await res.json();
    const el = document.getElementById('history-list');

    if (!json.ok || !json.data.length) {
      el.innerHTML = `<div class="empty-state" style="padding:16px 0">
        <div class="icon">🤖</div>
        <div class="title">분석 이력 없음</div>
        <div class="desc">AI 분석이 실행되면 여기에 표시됩니다</div>
      </div>`;
      return;
    }

    el.innerHTML = json.data.map(h => {
      let actionCls = 'hold', actionColor = 'action-hold';
      if ((h.action||'').includes('매도')) { actionCls = 'sell'; actionColor = 'action-sell'; }
      else if ((h.action||'').includes('매수')) { actionCls = 'buy'; actionColor = 'action-buy'; }

      let resultBadge = '';
      if (h.actual_result === 'correct') {
        resultBadge = '<span class="badge badge-green">적중</span>';
      } else if (h.actual_result === 'incorrect') {
        resultBadge = '<span class="badge badge-red">미적중</span>';
      } else {
        resultBadge = `<button class="btn btn-secondary btn-sm" style="padding:3px 10px;font-size:11px" onclick="markResult(${h.id}, this)">결과 입력</button>`;
      }

      const conf = h.confidence
        ? `<span class="badge ${h.confidence==='높음'?'badge-green':h.confidence==='보통'?'badge-yellow':'badge-red'}">${h.confidence}</span>`
        : '';

      const timeStr = h.created_at
        ? new Date(h.created_at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})
        : '';

      const reason = (h.reason||'-').substring(0, 90) + ((h.reason||'').length > 90 ? '…' : '');

      return `<div class="history-item" id="hi-${h.id}">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
          <span class="history-date">${h.date}${timeStr ? ' · ' + timeStr : ''}</span>
          ${h.stock_name ? `<span style="font-size:11px;font-weight:600;color:var(--text)">${h.stock_name}</span>` : ''}
          ${conf}
          <span style="margin-left:auto">${resultBadge}</span>
        </div>
        <div class="ai-action ${actionCls}" style="margin-top:0">
          <span class="action-label ${actionColor}">${h.action||'-'}</span>
          <span style="color:var(--text-muted);font-size:12px">${reason}</span>
        </div>
        ${h.target_price ? `<div style="font-size:11px;color:var(--text-muted);margin-top:6px;display:flex;gap:12px">
          <span>🎯 목표가 <strong style="color:var(--text)">${h.target_price.toLocaleString()}원</strong></span>
          ${h.stop_loss ? `<span>🛡 손절가 <strong style="color:var(--text)">${h.stop_loss.toLocaleString()}원</strong></span>` : ''}
        </div>` : ''}
      </div>`;
    }).join('');
  } catch(e) {}
}

async function markResult(id, btn) {
  const result = confirm('AI 추천이 적중했나요?\n확인=적중 / 취소=미적중');
  const val = result ? 'correct' : 'incorrect';
  try {
    const res = await fetch('/api/history/' + id + '/result', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ result: val })
    });
    const json = await res.json();
    if (json.ok) {
      const row = document.getElementById('hi-' + id);
      if (row) {
        const old = row.querySelector('button');
        if (old) old.outerHTML = val === 'correct'
          ? '<span class="badge badge-green">적중</span>'
          : '<span class="badge badge-red">미적중</span>';
      }
    }
  } catch(e) {}
}

loadPerformance();
loadHistory();
</script>
</body>
</html>
