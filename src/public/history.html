<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>매매일지 - AI 트레이더</title>
<link rel="stylesheet" href="/style.css">
<style>
.period-tabs { display:flex; gap:8px; margin:12px 16px; }
.period-tab { flex:1; padding:8px 0; text-align:center; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text-muted); font-size:13px; font-weight:600; cursor:pointer; }
.period-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.trade-date-group { margin-bottom:4px; }
.trade-date-header { font-size:11px; font-weight:700; color:var(--text-muted); padding:8px 16px 4px; text-transform:uppercase; letter-spacing:0.5px; }
.trade-item { background:var(--card); margin:0 0 1px; padding:12px 16px; display:flex; align-items:center; gap:10px; }
.trade-item:first-of-type { border-radius:10px 10px 0 0; }
.trade-item:last-of-type { border-radius:0 0 10px 10px; margin-bottom:8px; }
.trade-item:only-of-type { border-radius:10px; margin-bottom:8px; }
.trade-badge { font-size:11px; font-weight:700; padding:3px 8px; border-radius:5px; white-space:nowrap; }
.badge-profit { background:#1a3a2a; color:#4ade80; }
.badge-loss { background:#3a1a1a; color:#f87171; }
.badge-switch { background:#1a2a3a; color:#60a5fa; }
.badge-buy { background:#2a2a1a; color:#facc15; }
.trade-name { font-size:14px; font-weight:700; color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.trade-pl { text-align:right; white-space:nowrap; }
.trade-pl-amount { font-size:14px; font-weight:700; }
.trade-pl-rate { font-size:11px; color:var(--text-muted); margin-top:1px; }
.summary-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); border-radius:10px; overflow:hidden; margin:12px 16px; }
.summary-cell { background:var(--card); padding:12px 8px; text-align:center; }
.summary-val { font-size:17px; font-weight:800; }
.summary-lbl { font-size:11px; color:var(--text-muted); margin-top:3px; }
.total-pl-bar { margin:0 16px 12px; background:var(--card); border-radius:10px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; }
.total-pl-label { font-size:12px; color:var(--text-muted); }
.total-pl-amount { font-size:20px; font-weight:800; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">📒 매매일지</div>
    <div class="header-sub">실현 손익 기록</div>
  </div>
</div>

<div class="period-tabs">
  <div class="period-tab active" onclick="setPeriod(7, this)">7일</div>
  <div class="period-tab" onclick="setPeriod(30, this)">30일</div>
  <div class="period-tab" onclick="setPeriod(9999, this)">전체</div>
</div>

<div class="summary-grid" id="summary-grid">
  <div class="summary-cell">
    <div class="summary-val" id="s-total">-</div>
    <div class="summary-lbl">총 매도</div>
  </div>
  <div class="summary-cell">
    <div class="summary-val positive" id="s-profit">-</div>
    <div class="summary-lbl">익절</div>
  </div>
  <div class="summary-cell">
    <div class="summary-val negative" id="s-loss">-</div>
    <div class="summary-lbl">손절</div>
  </div>
</div>

<div class="total-pl-bar">
  <div>
    <div class="total-pl-label">누적 실현손익</div>
    <div class="total-pl-amount" id="s-total-pl">-</div>
  </div>
  <div style="text-align:right">
    <div class="total-pl-label">승률</div>
    <div class="summary-val" id="s-winrate" style="font-size:20px;font-weight:800">-</div>
  </div>
</div>

<div id="trade-list">
  <div class="loading"><div class="spinner"></div></div>
</div>

<nav class="nav-bottom">
  <a href="/"><span class="icon">🏠</span>홈</a>
  <a href="/portfolio.html"><span class="icon">💼</span>자산입력</a>
  <a href="/chat.html"><span class="icon">🤖</span>AI질문</a>
  <a href="/history.html" class="active"><span class="icon">📒</span>매매일지</a>
</nav>

<script>
let currentDays = 7;

function setPeriod(days, el) {
  currentDays = days;
  document.querySelectorAll('.period-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  loadTrades();
}

function typeBadge(type) {
  const map = {
    sell_profit: ['익절', 'badge-profit'],
    sell_loss:   ['손절', 'badge-loss'],
    switch:      ['교체', 'badge-switch'],
    buy:         ['매수', 'badge-buy'],
  };
  const [label, cls] = map[type] || [type, 'badge-buy'];
  return `<span class="trade-badge ${cls}">${label}</span>`;
}

async function loadTrades() {
  const el = document.getElementById('trade-list');
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    const params = currentDays === 9999 ? 'days=3650' : `days=${currentDays}`;
    const res = await fetch(`/api/history/trades?${params}`);
    const json = await res.json();
    if (!json.ok) throw new Error();
    const { trades, summary } = json.data;

    document.getElementById('s-total').textContent = summary.total_sells;
    document.getElementById('s-profit').textContent = summary.profit_count;
    document.getElementById('s-loss').textContent = summary.loss_count;

    const plEl = document.getElementById('s-total-pl');
    const pl = summary.total_pl || 0;
    plEl.textContent = (pl >= 0 ? '+' : '') + pl.toLocaleString() + '원';
    plEl.className = 'total-pl-amount ' + (pl >= 0 ? 'positive' : 'negative');

    const wrEl = document.getElementById('s-winrate');
    wrEl.textContent = summary.win_rate !== null ? summary.win_rate + '%' : '-';
    wrEl.className = 'summary-val ' + (summary.win_rate >= 50 ? 'positive' : summary.win_rate !== null ? 'negative' : '');

    if (!trades.length) {
      el.innerHTML = `<div class="empty-state" style="padding:32px 0">
        <div class="icon">📒</div>
        <div class="title">매매 기록 없음</div>
        <div class="desc">자산입력 탭에서 매도/매수를 입력하면<br>여기에 표시됩니다</div>
      </div>`;
      return;
    }

    // group by date
    const byDate = {};
    for (const t of trades) {
      if (!byDate[t.date]) byDate[t.date] = [];
      byDate[t.date].push(t);
    }

    el.innerHTML = Object.entries(byDate).map(([date, items]) => {
      const dayPL = items
        .filter(t => t.trade_type !== 'buy')
        .reduce((s, t) => s + (t.profit_loss || 0), 0);
      const daySign = dayPL >= 0 ? '+' : '';
      const dayCls = dayPL >= 0 ? 'positive' : 'negative';

      const rows = items.map((t, i) => {
        const isSell = t.trade_type !== 'buy';
        const pl = t.profit_loss || 0;
        const plSign = pl >= 0 ? '+' : '';
        const plCls = pl >= 0 ? 'positive' : 'negative';

        const rate = t.avg_price && t.price
          ? Math.round(((t.price - t.avg_price) / t.avg_price) * 10000) / 100
          : null;

        const isFirst = i === 0;
        const isLast = i === items.length - 1;
        const isOnly = items.length === 1;
        let radius = '';
        if (isOnly) radius = 'border-radius:10px;';
        else if (isFirst) radius = 'border-radius:10px 10px 0 0;';
        else if (isLast) radius = 'border-radius:0 0 10px 10px;';

        return `<div class="trade-item" style="${radius}">
          ${typeBadge(t.trade_type)}
          <div class="trade-name">${t.stock_name || '-'}</div>
          ${isSell ? `<div class="trade-pl">
            <div class="trade-pl-amount ${plCls}">${plSign}${pl.toLocaleString()}원</div>
            ${rate !== null ? `<div class="trade-pl-rate">${plSign}${rate}%</div>` : ''}
          </div>` : `<div style="font-size:12px;color:var(--text-muted)">${(t.price||0).toLocaleString()}원</div>`}
        </div>`;
      }).join('');

      return `<div class="trade-date-group">
        <div class="trade-date-header" style="display:flex;justify-content:space-between;padding-right:16px">
          <span>${date}</span>
          ${dayPL !== 0 ? `<span class="${dayCls}" style="font-size:11px;font-weight:700">${daySign}${dayPL.toLocaleString()}원</span>` : ''}
        </div>
        <div style="margin:0 16px">
          ${rows}
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    el.innerHTML = `<div class="empty-state" style="padding:32px 0">
      <div class="icon">⚠️</div>
      <div class="desc">데이터를 불러올 수 없습니다</div>
    </div>`;
  }
}

loadTrades();
</script>
</body>
</html>
